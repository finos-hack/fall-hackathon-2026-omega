[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gac-workbook"
version = "0.1.0"
description = "Trace FINOS CALM controls to FINOS AI Governance Framework risks and export an Excel evidence workbook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jiaxing Xue" }]
dependencies = [
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gac-workbook = "gac_workbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
